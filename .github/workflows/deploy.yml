name: publish-and-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: prod-os-service
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -Pquality clean verify
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Validate Academy session configuration
        env:
          ACCESS: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SESSION: ${{ secrets.AWS_SESSION_TOKEN }}
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
        run: test -n "$ACCESS" && test -n "$SECRET" && test -n "$SESSION" && test -n "$CLUSTER"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: aws sts get-caller-identity --query Account --output text
      - uses: azure/setup-kubectl@v4
      - name: Select cluster
        env: {CLUSTER: '${{ vars.EKS_CLUSTER_NAME }}'}
        run: aws eks update-kubeconfig --name "$CLUSTER"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install PyYAML==6.0.2
      - name: Render Academy app
        env:
          RDS_HOST: ${{ vars.RDS_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: python scripts/render-academy.py . --rds-host "$RDS_HOST" --image "$IMAGE" --output /tmp/app.yaml
      - run: kubectl apply --dry-run=server -f /tmp/app.yaml
      - run: kubectl apply -f /tmp/app.yaml
      - name: Verify rollout
        id: rollout
        run: kubectl rollout status -n workshop deployment/os-service --timeout=180s
      - name: Roll back failed rollout
        if: failure() && steps.rollout.outcome == 'failure'
        run: kubectl rollout undo -n workshop deployment/os-service
