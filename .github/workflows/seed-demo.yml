name: seed-demo-academy
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: CARREGAR SEEDS DEMO, RESTAURAR PROFILE OS ou DIAGNOSTICAR OS
        type: string
        required: true
      operation:
        description: Carregar seeds ou recuperar somente o profile normal
        type: choice
        options: [seed, restore, inspect]
        default: seed
        required: true
permissions:
  contents: read
concurrency:
  group: prod-os-service
  cancel-in-progress: false
jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm demo data load
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$OPERATION" = 'inspect' ]; then
            test "$CONFIRMATION" = 'DIAGNOSTICAR OS'
          elif [ "$OPERATION" = 'restore' ]; then
            test "$CONFIRMATION" = 'RESTAURAR PROFILE OS'
          else
            test "$CONFIRMATION" = 'CARREGAR SEEDS DEMO'
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Select cluster
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          test -n "$CLUSTER"
          aws eks update-kubeconfig --name "$CLUSTER"
      - name: Run existing DemoData and restore normal profile
        if: inputs.operation != 'inspect'
        env:
          OPERATION: ${{ inputs.operation }}
        run: python -u scripts/seed-demo.py --operation "$OPERATION"
      - name: Inspect rollout health without credentials or application logs
        if: always()
        run: |
          kubectl -n workshop get deployment os-service -o custom-columns='NAME:.metadata.name,DESIRED:.spec.replicas,UPDATED:.status.updatedReplicas,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas'
          kubectl -n workshop get pods -l app=os-service -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[*].ready,WAITING:.status.containerStatuses[*].state.waiting.reason,EXIT:.status.containerStatuses[*].lastState.terminated.exitCode,RESTARTS:.status.containerStatuses[*].restartCount'
          kubectl -n workshop get events --field-selector type=Warning,involvedObject.kind=Pod -o custom-columns='POD:.involvedObject.name,REASON:.reason,MESSAGE:.message' | tail -n 20
          kubectl -n workshop get deployment os-service -o json | python -c 'import json,sys; d=json.load(sys.stdin); c=next(c for c in d["spec"]["template"]["spec"]["containers"] if c["name"]=="app"); print("Temporary OS env fields still present:", [e["name"] for e in c.get("env", []) if e["name"] in ("SPRING_PROFILES_ACTIVE", "DEMO_PASSWORD")])'
