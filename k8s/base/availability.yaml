apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: os-service}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: os-service}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: os-service}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: os-service}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
