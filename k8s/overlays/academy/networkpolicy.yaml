apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: os-service
spec:
  podSelector:
    matchLabels:
      app: os-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - podSelector:
        matchLabels:
          app: billing-service
    - podSelector:
        matchLabels:
          app: execucao-service
    - ipBlock:
        cidr: 10.0.0.0/8
    - podSelector:
        matchLabels:
          app: fase4-edge
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: REPLACE_WITH_RDS_IPV4_CIDR
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: rabbit
    ports:
    - protocol: TCP
      port: 5672
  - to:
    - podSelector:
        matchLabels:
          app: otel
    ports:
    - protocol: TCP
      port: 4318
